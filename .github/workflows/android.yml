name: Android APK

# Builds an installable debug APK. Run it from the repo's Actions tab ("Run workflow").
# One-time setup: Settings > Secrets and variables > Actions > Variables > New variable
#   APP_URL = https://your-app.vercel.app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]

jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    env:
      CAP_SERVER_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Check APP_URL is set
        run: |
          if [ -z "$CAP_SERVER_URL" ]; then
            echo "::error::Repository variable APP_URL is empty. Add it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          echo "Using $CAP_SERVER_URL"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm install

      - name: Create Android project (first run only)
        run: test -d android || npx cap add android

      - name: Allow microphone and speech service (voice search)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n</manifest>#' "$M"
          grep -n "RECORD_AUDIO\|RecognitionService" "$M"

      - run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: irfan-autos-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

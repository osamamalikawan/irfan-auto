name: Android APK

# Builds an installable debug APK. Run it from the repo's Actions tab ("Run workflow").
# One-time setup: Settings > Secrets and variables > Actions > Variables > New variable
#   APP_URL = https://your-app.vercel.app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      CAP_SERVER_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check APP_URL is set
        run: test -n "$CAP_SERVER_URL" || (echo "Add a repository variable APP_URL (your Vercel URL)." && exit 1)

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm install

      - name: Create Android project (first run only)
        run: test -d android || npx cap add android

      - run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: irfan-autos-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

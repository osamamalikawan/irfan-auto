name: Salesman Android APK

# Builds the salesman app. Run it from the GitHub "Actions" tab (Run workflow), or it runs by itself when salesman-app/ changes.
# The finished APK is under the run's "Artifacts" (irfan-salesman-apk).
# The website address is set in salesman-app/app/src/main/java/pk/irfanautos/salesman/Config.kt

on:
  workflow_dispatch:
  push:
    paths:
      - "salesman-app/**"
      - ".github/workflows/salesman-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The GitHub build machine already has the Android SDK; only make sure its licences are accepted.
      - name: Accept Android SDK licences
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -n "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null || true; fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build the APK
        working-directory: salesman-app
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: irfan-salesman-apk
          path: salesman-app/app/build/outputs/apk/debug/app-debug.apk
